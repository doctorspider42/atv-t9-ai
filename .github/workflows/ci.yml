name: CI

# Feature branches and pull requests. develop and main both publish now, so they are covered
# by their own release workflows rather than duplicated here.
on:
  push:
    branches: ['feature/**', 'fix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      # The core module is Android-free on purpose, so the simulator and the shipped IME
      # cannot diverge. With no device channel and no emulator, these tests plus lint are the
      # entire safety net.
      - name: Check
        run: ./gradlew --no-daemon check

      - name: Lint
        run: ./gradlew --no-daemon lint

      # Both flavours, because a flavour-specific resource or manifest mistake only shows up in
      # the flavour that has it.
      - name: Assemble debug
        run: >
          ./gradlew --no-daemon assembleProdDebug assembleDevDebug
          -PversionCode=${{ github.run_number }}
          -PversionName=ci-${{ github.run_number }}

      - name: Upload debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: apk-debug-${{ github.run_number }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ github.run_number }}
          path: |
            **/build/reports/tests/**
            **/build/reports/lint-results-*.html
          if-no-files-found: ignore

  # The one thing the job above cannot be wrong about: that the keyboard installs, that Android
  # will select it, that a key pressed on the hardware reaches it, and that a word comes back out.
  # Every decision underneath is already watched by the JVM tests, so this is one test and stays
  # one test - see `KeyboardSmokeTest`.
  #
  # A job of its own, with nothing depending on it, so that the tests, lint and the APKs never
  # wait behind a device to say what they already know. It is not allowed to fail quietly either:
  # a smoke test that cannot turn the build red is decoration. Three minutes of a runner end to
  # end, measured, which is roughly what the job beside it costs and is the whole price of it.
  emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      # Without this the emulator falls back to ARM translation and takes long enough to look
      # like a hang. The runner has the hardware; the device node is simply not readable by
      # default.
      - name: Allow KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # A phone image rather than the television this keyboard is for. The test is about whether
      # keys arrive and a word comes back, and neither is a thing a TV image is right about and a
      # phone image is wrong about - while the TV images are larger, slower to boot and carry a
      # launcher that wants a network. The television is tested on the television.
      #
      # API 30 because it is old enough to be quick and far enough above minSdk 23 to be ordinary.
      # The one behaviour this depends on - a soft keyboard hidden while a hardware keyboard is
      # attached - has been true on every version since long before it.
      - name: Smoke test on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          emulator-options: >-
            -no-window -no-snapshot -no-audio -no-boot-anim
            -gpu swiftshader_indirect -camera-back none
          script: >
            ./gradlew --no-daemon :app:connectedDevDebugAndroidTest
            -PversionCode=${{ github.run_number }}
            -PversionName=ci-${{ github.run_number }}

      - name: Upload smoke test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-${{ github.run_number }}
          path: app/build/reports/androidTests/**
          if-no-files-found: ignore
